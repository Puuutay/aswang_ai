<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aswang AI Studio | Video Creator</title>
    <!-- FFmpeg.wasm Library -->
    <script src="https://unpkg.com"></script>
    <style>
        :root { --blood-red: #8b0000; --dark-bg: #0a0a0a; --text-gray: #ccc; }
        body { background: var(--dark-bg); color: var(--text-gray); font-family: 'Segoe UI', Arial, sans-serif; margin: 0; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 800px; padding: 40px 20px; text-align: center; }
        h1 { color: var(--blood-red); text-transform: uppercase; letter-spacing: 4px; margin-bottom: 10px; }
        p { font-size: 0.9em; margin-bottom: 30px; color: #666; }
        
        textarea { 
            width: 100%; height: 120px; background: #151515; color: #ff4d4d; border: 1px solid #333; 
            padding: 15px; border-radius: 8px; font-size: 16px; resize: none; box-sizing: border-box;
        }

        .controls { margin-top: 20px; }
        .btn { 
            background: var(--blood-red); color: white; border: none; padding: 15px 40px; 
            font-weight: bold; border-radius: 5px; cursor: pointer; transition: 0.3s; width: 100%;
        }
        .btn:hover { background: #ff0000; box-shadow: 0 0 15px var(--blood-red); }
        .btn:disabled { background: #333; cursor: not-allowed; }

        /* Progress Section */
        .status-container { margin-top: 30px; display: none; }
        .progress-bar { width: 100%; height: 12px; background: #222; border-radius: 6px; overflow: hidden; margin: 15px 0; }
        #progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, var(--blood-red), #ff0000); transition: 0.4s; }
        #status-text { font-style: italic; font-size: 0.85em; }

        /* Preview Section */
        #preview-section { margin-top: 40px; display: none; border-top: 1px solid #222; padding-top: 30px; }
        video { width: 100%; border-radius: 8px; border: 2px solid #222; margin-bottom: 20px; }
        .download-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-sub { background: #222; border: 1px solid #444; }
    </style>
</head>
<body>

<div class="app-container">
    <h1>🌑 Aswang AI Studio</h1>
    <p>AI-powered horror video creator para sa YouTube at TikTok.</p>
    
    <textarea id="prompt-input" placeholder="Isulat ang iyong kwento o prompt dito... (Halimbawa: Ang misteryosong tinig sa loob ng kawayanan tuwing alas-tres ng madaling araw)"></textarea>

    <div class="controls">
        <button id="start-btn" class="btn" onclick="startEngine()">BUUIN ANG VIDEO (5 MINS)</button>
    </div>

    <div class="status-container" id="status-box">
        <div id="status-text">Inihahanda ang AI engine...</div>
        <div class="progress-bar">
            <div id="progress-fill"></div>
        </div>
        <div id="percentage">0%</div>
    </div>

    <div id="preview-section">
        <h3>Preview ng iyong Gawa</h3>
        <video id="final-video" controls></video>
        <div class="download-group">
            <button class="btn" onclick="downloadFile('video')">DOWNLOAD MP4</button>
            <button class="btn btn-sub" onclick="generateThumbnail()">SAVE THUMBNAIL</button>
        </div>
    </div>
</div>

<canvas id="thumb-canvas" style="display:none;"></canvas>

<script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    const ffmpeg = createFFmpeg({ 
        log: true,
        progress: ({ ratio }) => updateProgress(ratio)
    });

    let generatedImageUrl = ""; // Store image for thumbnail

    async function startEngine() {
        const prompt = document.getElementById('prompt-input').value;
        if (!prompt) return alert("Maglagay muna ng prompt!");

        const startBtn = document.getElementById('start-btn');
        const statusBox = document.getElementById('status-box');
        
        startBtn.disabled = true;
        statusBox.style.display = 'block';

        try {
            if (!ffmpeg.isLoaded()) {
                updateStatus("🚀 Loading FFmpeg Core...", 5);
                await ffmpeg.load();
            }

            // 1. AI Image Generation (Placeholder logic for Demo)
            updateStatus("🎨 Generating AI Scenes...", 20);
            const encodedPrompt = encodeURIComponent(prompt + ", cinematic horror style, hyper-realistic, dark forest");
            generatedImageUrl = `https://pollinations.ai{encodedPrompt}?width=1280&height=720&seed=${Math.random()}`;
            
            // 2. Fetch Assets
            updateStatus("🎙️ Generating Voice & SFX...", 40);
            const imgData = await fetch(generatedImageUrl).then(r => r.arrayBuffer());
            
            // 3. Virtual Filesystem
            ffmpeg.FS('writeFile', 'input.jpg', new Uint8Array(imgData));

            // 4. FFmpeg Rendering (Ken Burns + Filter + 5-min structure)
            // Sa actual, multiple clips ang concat dito. For demo, a 10-sec loop is shown.
            updateStatus("🎬 Rendering final movie (5-min format)...", 70);
            await ffmpeg.run(
                '-loop', '1', '-i', 'input.jpg',
                '-vf', "zoompan=z='min(zoom+0.0015,1.5)':d=300:s=1280x720:x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)', vignette=PI/4, noise=alls=10:allf=t+u",
                '-t', '10', // Test duration (Gawing 300 para sa 5 mins)
                '-c:v', 'libx264', '-pix_fmt', 'yuv420p',
                'output.mp4'
            );

            // 5. Finalize
            updateStatus("✅ Done! Processing video...", 100);
            const data = ffmpeg.FS('readFile', 'output.mp4');
            const videoUrl = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));
            
            document.getElementById('final-video').src = videoUrl;
            document.getElementById('preview-section').style.display = 'block';
            startBtn.disabled = false;

        } catch (err) {
            console.error(err);
            alert("Error: " + err.message);
            startBtn.disabled = false;
        }
    }

    function updateStatus(text, percent) {
        document.getElementById('status-text').innerText = text;
        document.getElementById('progress-fill').style.width = percent + "%";
        document.getElementById('percentage').innerText = percent + "%";
    }

    function updateProgress(ratio) {
        if (ratio > 0) {
            const p = Math.floor(ratio * 100);
            document.getElementById('progress-fill').style.width = p + "%";
            document.getElementById('percentage').innerText = p + "%";
        }
    }

    function downloadFile(type) {
        const link = document.createElement('a');
        link.href = document.getElementById('final-video').src;
        link.download = `aswang_story_${Date.now()}.mp4`;
        link.click();
    }

    async function generateThumbnail() {
        const canvas = document.getElementById('thumb-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 1280;
        canvas.height = 720;

        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = generatedImageUrl;
        
        img.onload = () => {
            ctx.drawImage(img, 0, 0, 1280, 720);
            ctx.fillStyle = "rgba(0,0,0,0.4)";
            ctx.fillRect(0, 0, 1280, 720);
            
            ctx.fillStyle = "#ff0000";
            ctx.font = "bold 80px Arial";
            ctx.textAlign = "center";
            ctx.fillText("MISTER KILABOT", 640, 360);
            
            const thumbUrl = canvas.toDataURL("image/jpeg");
            const link = document.createElement('a');
            link.href = thumbUrl;
            link.download = "thumbnail_aswang.jpg";
            link.click();
        };
    }
</script>

</body>
</html>
